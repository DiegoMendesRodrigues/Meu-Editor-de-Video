name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          # Ubuntu 22.04 (glibc 2.35): o pacote gerado roda também no Debian 12 e no Ubuntu 24.04.
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-14
            rid: osx-arm64
          # A imagem macos-13 (Intel) foi desativada pelo GitHub; macos-15-intel é a substituta Intel.
          # O ONNX Runtime não publica bibliotecas nativas para osx-x64: no Mac Intel o programa abre sem os
          # recursos de IA, e os testes de IA que precisam de modelo são ignorados (sem modelos no CI).
          - os: macos-15-intel
            rid: osx-x64
    env:
      # Assinatura e notarização do macOS (opcionais): sem os segredos, o .dmg sai sem assinatura.
      MED_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Bibliotecas que os testes e a interface sem tela (Avalonia.Headless + Skia) carregam no Linux.
      # espeak-ng: fala (texto para voz) nos testes de áudio.
      - name: Instalar bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libfreetype6 libx11-6 libice6 libsm6 libgl1 libasound2 libpulse0 libva2 libgtk-3-0 libxkbcommon0 libxtst6 libxt6 libinput10 libwayland-client0 libdrm2 libgomp1 libatomic1 espeak-ng

      # Ferramentas para compilar o FFmpeg e as bibliotecas de codificação a partir do código-fonte (scripts/macos).
      # nasm é usado pelos codificadores em x86 (Mac Intel); no arm64 é ignorado.
      - name: Instalar ferramentas de compilação (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config nasm

      - name: Cache das dependências nativas
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('scripts/deps.lock.json', 'scripts/macos/**') }}

      # No Windows baixa FFmpeg, MODNet e o Visual C++; no Linux, FFmpeg compartilhado; no macOS, compila FFmpeg e o
      # OpenCvSharp a partir do código-fonte (scripts/macos), o que leva um tempo na primeira vez (depois vem do cache).
      - name: Baixar e verificar dependências nativas
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -Strict

      - name: Restaurar
        run: dotnet restore MeuEditorDeVideo.sln

      - name: Compilar
        run: dotnet build MeuEditorDeVideo.sln -c Release --no-restore

      - name: Testar
        run: dotnet test MeuEditorDeVideo.sln -c Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults

      # ----- Pacotes (só em push para main) -----------------------------------------------------------------------

      - name: Gerar o instalador (MSI + Setup.exe, sem assinatura)
        if: github.event_name == 'push' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && runner.os == 'Windows'
        with:
          name: instalador-${{ matrix.rid }}
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.exe
            artifacts/installer/SHA256SUMS.txt

      # O mantenedor ("Nome <email>") vem da variável do repositório MED_DEB_MAINTAINER; sem ela o pacote não é gerado.
      - name: Gerar o pacote .deb
        if: github.event_name == 'push' && runner.os == 'Linux' && vars.MED_DEB_MAINTAINER != ''
        shell: pwsh
        env:
          MED_DEB_MAINTAINER: ${{ vars.MED_DEB_MAINTAINER }}
        run: ./scripts/build-deb.ps1 -Rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && runner.os == 'Linux' && vars.MED_DEB_MAINTAINER != ''
        with:
          name: pacote-deb-${{ matrix.rid }}
          path: |
            artifacts/linux/*.deb
            artifacts/linux/SHA256SUMS.txt

      # Certificado "Developer ID Application" (.p12 em base64) num chaveiro temporário, só se os segredos existirem.
      # Os valores chegam por variáveis de ambiente (nunca interpolados no texto do comando).
      - name: Importar o certificado de assinatura (macOS)
        if: github.event_name == 'push' && runner.os == 'macOS' && env.MED_MACOS_SIGN_IDENTITY != '' && env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/med-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificado.p12"
          security import "$RUNNER_TEMP/certificado.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificado.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # O chaveiro temporário entra na lista de busca, antes dos demais, para o codesign achar a identidade.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MED_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MED_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # Perfil do notarytool (guardado no mesmo chaveiro temporário) com o ID Apple, a equipe e a senha de app.
      - name: Guardar as credenciais de notarização (macOS)
        if: github.event_name == 'push' && runner.os == 'macOS' && env.MED_KEYCHAIN != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool store-credentials med-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$MED_KEYCHAIN"
          echo "MED_MACOS_NOTARY_PROFILE=med-notary" >> "$GITHUB_ENV"
          echo "MED_MACOS_NOTARY_KEYCHAIN=$MED_KEYCHAIN" >> "$GITHUB_ENV"

      - name: Gerar o aplicativo e o .dmg (macOS)
        if: github.event_name == 'push' && runner.os == 'macOS'
        shell: pwsh
        run: |
          $parametros = @('-Rid', '${{ matrix.rid }}')
          if ($env:MED_KEYCHAIN -and $env:MED_MACOS_SIGN_IDENTITY) { $parametros += '-Sign' }
          if ($env:MED_MACOS_NOTARY_PROFILE) { $parametros += '-Notarize' }
          Write-Host "build-macos.ps1 $($parametros -join ' ')"
          ./scripts/build-macos.ps1 @parametros

      - name: Remover o chaveiro temporário (macOS)
        if: always() && runner.os == 'macOS' && env.MED_KEYCHAIN != ''
        run: security delete-keychain "$MED_KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && runner.os == 'macOS'
        with:
          name: pacote-dmg-${{ matrix.rid }}
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/SHA256SUMS.txt
