name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache das dependências nativas
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('scripts/deps.lock.json') }}

      - name: Baixar e verificar dependências nativas (FFmpeg, MODNet, Visual C++)
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -Strict

      - name: Restaurar
        run: dotnet restore MeuEditorDeVideo.sln

      - name: Compilar
        run: dotnet build MeuEditorDeVideo.sln -c Release --no-restore

      - name: Testar
        run: dotnet test MeuEditorDeVideo.sln -c Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      - name: Gerar o instalador (MSI + Setup.exe, sem assinatura)
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: instalador
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.exe
            artifacts/installer/SHA256SUMS.txt
